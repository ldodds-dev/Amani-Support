name: AMANI Health Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: amani-health-monitor
  cancel-in-progress: false

jobs:
  health-check:
    name: Check AMANI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AMANI_BASE_URL: https://amani-browser.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Ensure health-monitor label exists
        shell: bash
        run: |
          gh label create \
            "health-monitor" \
            --repo "$GITHUB_REPOSITORY" \
            --color "B60205" \
            --description "Automated AMANI health incident" \
            --force

      - name: Run health checks
        id: health
        shell: bash
        run: |
          set +e

          AMANI_FAILURES=""
          AMANI_TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          check_status() {
            AMANI_NAME="$1"
            AMANI_URL="$2"

            AMANI_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --max-time 30 \
                --retry 2 \
                --retry-delay 5 \
                --retry-all-errors \
                --output /tmp/amani-response \
                --write-out '%{http_code}' \
                "$AMANI_URL"
            )"

            AMANI_CURL_STATUS=$?

            if [ "$AMANI_CURL_STATUS" -ne 0 ]; then
              AMANI_FAILURES="${AMANI_FAILURES}
          - ${AMANI_NAME}: connection failed at ${AMANI_URL}"
            elif [[ ! "$AMANI_CODE" =~ ^2[0-9][0-9]$ ]]; then
              AMANI_FAILURES="${AMANI_FAILURES}
          - ${AMANI_NAME}: returned HTTP ${AMANI_CODE} at ${AMANI_URL}"
            fi
          }

          check_keyword() {
            AMANI_NAME="$1"
            AMANI_URL="$2"
            AMANI_KEYWORD="$3"

            AMANI_BODY="$(
              curl \
                --silent \
                --show-error \
                --location \
                --max-time 30 \
                --retry 2 \
                --retry-delay 5 \
                --retry-all-errors \
                "$AMANI_URL"
            )"

            AMANI_CURL_STATUS=$?

            if [ "$AMANI_CURL_STATUS" -ne 0 ]; then
              AMANI_FAILURES="${AMANI_FAILURES}
          - ${AMANI_NAME}: connection failed at ${AMANI_URL}"
            elif ! printf '%s' "$AMANI_BODY" |
              grep --quiet --ignore-case "$AMANI_KEYWORD"; then
              AMANI_FAILURES="${AMANI_FAILURES}
          - ${AMANI_NAME}: expected content '${AMANI_KEYWORD}' was missing"
            fi
          }

          check_keyword \
            "Homepage" \
            "$AMANI_BASE_URL/" \
            "Private by Default"

          check_status \
            "Search API" \
            "$AMANI_BASE_URL/api/search?q=Florida"

          check_status \
            "General search" \
            "$AMANI_BASE_URL/search?q=Florida"

          check_status \
            "Maps" \
            "$AMANI_BASE_URL/search?q=Florida&type=maps"

          check_status \
            "Flights" \
            "$AMANI_BASE_URL/search?q=flights&type=flights"

          check_status \
            "AI Mode" \
            "$AMANI_BASE_URL/search?q=Florida&type=ai"

          {
            echo "timestamp=$AMANI_TIMESTAMP"

            if [ -n "$AMANI_FAILURES" ]; then
              echo "failed=true"
              echo "failures<<AMANI_EOF"
              printf '%s\n' "$AMANI_FAILURES"
              echo "AMANI_EOF"
            else
              echo "failed=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Create or update incident
        if: steps.health.outputs.failed == 'true'
        shell: bash
        env:
          AMANI_FAILURES: ${{ steps.health.outputs.failures }}
          AMANI_TIMESTAMP: ${{ steps.health.outputs.timestamp }}
        run: |
          AMANI_ISSUE_NUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label "health-monitor" \
              --json number \
              --jq '.[0].number // empty'
          )"

          {
            echo "## Automated AMANI health incident"
            echo
            echo "**Detected:** $AMANI_TIMESTAMP"
            echo
            echo "### Failed checks"
            printf '%s\n' "$AMANI_FAILURES"
            echo
            echo "The monitor will check again automatically."
          } > /tmp/amani-incident.md

          if [ -n "$AMANI_ISSUE_NUMBER" ]; then
            gh issue comment \
              "$AMANI_ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/amani-incident.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "AMANI health incident detected" \
              --label "health-monitor" \
              --body-file /tmp/amani-incident.md
          fi

      - name: Close incident after recovery
        if: steps.health.outputs.failed == 'false'
        shell: bash
        env:
          AMANI_TIMESTAMP: ${{ steps.health.outputs.timestamp }}
        run: |
          AMANI_ISSUE_NUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label "health-monitor" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$AMANI_ISSUE_NUMBER" ]; then
            gh issue comment \
              "$AMANI_ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "AMANI recovered. All monitored checks passed at $AMANI_TIMESTAMP."

            gh issue close \
              "$AMANI_ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          AMANI_FAILED: ${{ steps.health.outputs.failed }}
          AMANI_FAILURES: ${{ steps.health.outputs.failures }}
          AMANI_TIMESTAMP: ${{ steps.health.outputs.timestamp }}
        run: |
          {
            echo "## AMANI Health Monitor"
            echo
            echo "**Checked:** $AMANI_TIMESTAMP"
            echo

            if [ "$AMANI_FAILED" = "true" ]; then
              echo "### Incident detected"
              printf '%s\n' "$AMANI_FAILURES"
            else
              echo "All monitored checks passed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
